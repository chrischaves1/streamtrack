<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#18042a"/>
  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="185" fill="#7c3aed" opacity="0.15"/>
  <!-- Play button circle -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed"/>
  <!-- Inner shadow ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#5b21b6" stroke-width="6"/>
  <!-- Play triangle - large and centered, offset right slightly for optical centering -->
  <polygon points="208,168 208,344 368,256" fill="white"/>
</svg>
